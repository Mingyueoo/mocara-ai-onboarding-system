spring:
  datasource:
    url: jdbc:h2:mem:mocara_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_UPPER=false
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false

  flyway:
    enabled: false

app:
  security:
    jwt:
      issuer: mocara-test
      secret: test-secret-key-for-tests-only-123456
      access-token-expiration-seconds: 900
      refresh-token-expiration-seconds: 1209600

